name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIVY_VERSION: 0.76.0
      TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: marketplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Marketplace.slnx

      - name: Build
        run: dotnet build Marketplace.slnx --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format Marketplace.slnx --verify-no-changes --no-restore

      - name: Architecture tests
        run: dotnet test --project tests/Marketplace.ArchitectureTests/Marketplace.ArchitectureTests.csproj --configuration Release --no-build

      - name: Unit tests
        run: dotnet test --project tests/Marketplace.UnitTests/Marketplace.UnitTests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test --project tests/Marketplace.IntegrationTests/Marketplace.IntegrationTests.csproj --configuration Release --no-build

      # Exit code 8 means no tests ran. Remove the flag when T-074 adds the eval runner.
      # Section 12.7: the case set and the replay gate, then eval-refunds over the saved outputs.
      - name: AI evals
        run: |
          dotnet test --project tests/Marketplace.AiEvals/Marketplace.AiEvals.csproj --configuration Release --no-build
          dotnet run --project src/Marketplace.Tools --configuration Release --no-build -- eval-refunds --mode recorded

      # Section 7.5: prove the migrations apply to an empty database. Run twice to show a re-run is a no-op.
      - name: Build migration bundle
        run: |
          dotnet tool restore
          dotnet restore src/Marketplace.Infrastructure/Marketplace.Infrastructure.csproj --runtime linux-x64
          dotnet ef migrations bundle --project src/Marketplace.Infrastructure --startup-project src/Marketplace.Infrastructure \
            --configuration Release --self-contained --runtime linux-x64 --output efbundle --force

      - name: Apply migration bundle to empty database
        env:
          CONN: Host=localhost;Port=5432;Database=marketplace;Username=marketplace;Password=ci-only-password
        run: |
          ./efbundle --connection "$CONN" --no-color
          ./efbundle --connection "$CONN" --no-color

      # Section 15.3 step 12: the production images build (api, worker, migration job, web). Publishing them is the CD
      # pipeline's job (T-062).
      - name: Build Docker images
        run: |
          docker build --file deploy/docker/Api.Dockerfile --tag marketplace-api:${{ github.sha }} .
          docker build --file deploy/docker/Worker.Dockerfile --tag marketplace-worker:${{ github.sha }} .
          docker build --file deploy/docker/Migrate.Dockerfile --tag marketplace-migrate:${{ github.sha }} .
          docker build --file deploy/docker/Web.Dockerfile --tag marketplace-web:${{ github.sha }} \
            --build-arg COVER_IMAGE_BASE_URL=https://example.blob.core.windows.net/product-covers/ .

      # Section 15.3 step 13 and section 11.7: fail on High or Critical findings that have a fix.
      - name: Install Trivy
        working-directory: ${{ runner.temp }}
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" trivy

      - name: Scan images with Trivy
        run: |
          for image in marketplace-api marketplace-worker marketplace-migrate marketplace-web; do
            "$RUNNER_TEMP/trivy" image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image:${{ github.sha }}"
          done

      # Section 15.3 step 14: fail on a High or Critical advisory in any direct or transitive package.
      - name: Check packages for known vulnerabilities
        run: |
          dotnet list Marketplace.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          jq -r '[.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)
                  | . as $package | .vulnerabilities[]? | select(.severity == "High" or .severity == "Critical")
                  | "\($package.id) \($package.resolvedVersion): \(.severity) \(.advisoryurl)"] | unique | .[]' vulnerable.json > findings.txt
          if [ -s findings.txt ]; then
            cat findings.txt
            exit 1
          fi
          echo "No High or Critical package advisories."

  # T-083: the Next.js client type-checks and builds. It talks to the API only through its own server.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: No raw colours outside the tokens
        run: npm run check:tokens

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Check packages for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks

      - name: Scan repository history
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1'
