name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Marketplace.slnx

      - name: Build
        run: dotnet build Marketplace.slnx --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format Marketplace.slnx --verify-no-changes --no-restore

      - name: Architecture tests
        run: dotnet test --project tests/Marketplace.ArchitectureTests/Marketplace.ArchitectureTests.csproj --configuration Release --no-build

      # Exit code 8 means no tests ran. Remove the flag when T-010 adds the first unit test.
      - name: Unit tests
        run: dotnet test --project tests/Marketplace.UnitTests/Marketplace.UnitTests.csproj --configuration Release --no-build --ignore-exit-code 8

      - name: Integration tests
        run: dotnet test --project tests/Marketplace.IntegrationTests/Marketplace.IntegrationTests.csproj --configuration Release --no-build

      # Exit code 8 means no tests ran. Remove the flag when T-074 adds the eval runner.
      - name: AI evals
        run: dotnet test --project tests/Marketplace.AiEvals/Marketplace.AiEvals.csproj --configuration Release --no-build --ignore-exit-code 8

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks

      - name: Scan repository history
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1'
