# T-061: the Azure infrastructure (deploy/bicep), staging only for now: production is deferred (T-063, see
# docs/spec-changelog.md). Pull requests that touch it get a what-if: what would be created, changed or deleted.
# Nothing is applied by a pull request. Applying is a manual run (workflow_dispatch with apply: true), so a billable
# deployment happens only when someone starts it.
#
# Sign-in is GitHub OIDC (section 15.5): a federated credential on the staging GitHub environment, no stored secrets.
# The AZURE_* values and BUDGET_ALERT_EMAIL are environment variables, not secrets.
name: Infrastructure

on:
  pull_request:
    paths:
      - deploy/bicep/**
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the deployment after the what-if (creates billable resources)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-staging
  cancel-in-progress: false

jobs:
  what-if:
    name: what-if (staging)
    runs-on: ubuntu-latest
    environment: staging
    # An explicit bash shell runs every step with -eo pipefail. Without it, "az ... | tee" takes tee's exit code,
    # and a failed deployment showed as a green step.
    defaults:
      run:
        shell: bash
    env:
      RESOURCE_GROUP: marketplace-staging-rg
      PARAMETERS: deploy/bicep/parameters.staging.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check the sign-in
        run: |
          az account show --query "{subscription: name, user: user.type}" --output table

      - name: Build and lint the Bicep
        run: az bicep build --file deploy/bicep/main.bicep --stdout > /dev/null

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "marketplace-${{ github.run_id }}" \
            --template-file deploy/bicep/main.bicep \
            --parameters "@$PARAMETERS" \
            --parameters budgetContactEmail="${{ vars.BUDGET_ALERT_EMAIL }}" \
            --result-format FullResourcePayloads --no-pretty-print --output json > what-if.json
          python3 - <<'PY' | tee what-if.txt
          import json
          changes = json.load(open("what-if.json"))["changes"]
          for change in sorted(changes, key=lambda c: (c["changeType"], c["resourceId"])):
              rid = change["resourceId"]
              print(f'{change["changeType"]:<10} {rid.split("/providers/", 1)[-1]}')
          print()
          counts = {}
          for change in changes:
              counts[change["changeType"]] = counts.get(change["changeType"], 0) + 1
          print(", ".join(f"{n} {kind}" for kind, n in sorted(counts.items())))
          PY
          {
            echo "### What-if: staging ($RESOURCE_GROUP)"
            echo '```'
            cat what-if.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a rejected deployment
        if: failure()
        run: |
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/bicep/main.bicep \
            --parameters "@$PARAMETERS" \
            --parameters budgetContactEmail="${{ vars.BUDGET_ALERT_EMAIL }}" \
            --output json 2>&1 | grep -o '"message": "[^"]*"' | sort -u || true
          # Resource-provider registration is not checked by validate or what-if; a failed apply's operations are.
          az deployment operation group list --resource-group "$RESOURCE_GROUP" --name "marketplace-${{ github.run_id }}" \
            --query "[?properties.provisioningState=='Failed'].properties.statusMessage.error.details[].message" --output tsv 2>/dev/null | sort -u || true

      - name: Upload the what-if
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: what-if-staging
          path: what-if.*

      - name: Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "marketplace-${{ github.run_id }}" \
            --template-file deploy/bicep/main.bicep \
            --parameters "@$PARAMETERS" \
            --parameters budgetContactEmail="${{ vars.BUDGET_ALERT_EMAIL }}" \
            --query properties.outputs --output json | tee outputs.json
